<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwitchOS Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #020617;
        --panel: #0f172a;
        --border: rgba(34, 211, 238, 0.18);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #22d3ee;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, rgba(34, 211, 238, 0.12), transparent 35%), var(--bg);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        padding: 24px;
      }
      main {
        width: min(100%, 560px);
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.92);
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 24px 80px rgba(2, 6, 23, 0.48);
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 2.75rem);
        line-height: 1.1;
      }
      p {
        margin: 0;
        line-height: 1.7;
        color: var(--muted);
      }
      .actions {
        margin-top: 24px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      a {
        text-decoration: none;
        border-radius: 999px;
        padding: 12px 18px;
        font-weight: 600;
      }
      .primary {
        background: var(--accent);
        color: #082f49;
      }
      .secondary {
        border: 1px solid rgba(148, 163, 184, 0.3);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">SwitchOS</div>
      <h1>You are offline</h1>
      <p>
        The operator dashboard cannot reach live services right now. Recent logistics, analytics, and merchant workflows
        will resume automatically when connectivity returns.
      </p>
      <div class="actions">
        <a class="primary" href="/dashboard">Return to dashboard</a>
        <a class="secondary" href="/logistics-control-tower">Open logistics control tower</a>
      </div>
    </main>
  </body>
</html>
