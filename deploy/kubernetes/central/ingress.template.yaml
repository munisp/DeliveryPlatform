# Template only. Replace the hostname, TLS secret, and ingress class before
# applying through the environment-specific overlay.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: central-app
  namespace: switchos
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: REPLACE_WITH_INGRESS_CLASS
  tls:
    - hosts: ["REPLACE_WITH_PUBLIC_APP_HOST"]
      secretName: REPLACE_WITH_TLS_SECRET
  rules:
    - host: REPLACE_WITH_PUBLIC_APP_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: central-app
                port:
                  name: http
