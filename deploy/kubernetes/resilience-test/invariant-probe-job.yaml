apiVersion: batch/v1
kind: Job
metadata:
  name: RESILIENCE_INVARIANT_PROBE_JOB_NAME
  namespace: resilience-test
  labels:
    app.kubernetes.io/name: resilience-invariant-probe
    app.kubernetes.io/part-of: deliveryplatform-resilience-testing
    resilience.delivery-platform.io/environment: non-production
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resilience-invariant-probe
        app.kubernetes.io/part-of: deliveryplatform-resilience-testing
        resilience.delivery-platform.io/environment: non-production
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: invariant-probe
          image: postgres:16.6-bookworm
          imagePullPolicy: IfNotPresent
          command: ["psql"]
          args:
            [
              "$(DATABASE_URL)",
              "-v",
              "ON_ERROR_STOP=1",
              "-f",
              "/sql/invariant-probe.sql",
            ]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: resilience-invariant-probe-database
                  key: database-url
          volumeMounts:
            - name: invariant-probe-sql
              mountPath: /sql
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: invariant-probe-sql
          configMap:
            name: resilience-invariant-probe-sql
            defaultMode: 0444
