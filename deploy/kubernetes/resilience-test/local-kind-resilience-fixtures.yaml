# Local kind fixture only. All tokens are synthetic and are invalid outside this disposable test cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: resilience-test
  labels:
    kubernetes.io/metadata.name: resilience-test
    resilience.delivery-platform.io/environment: non-production
    resilience.delivery-platform.io/local-fixture: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: resilience-validation-circuit-breaker
  namespace: resilience-test
  labels:
    resilience.delivery-platform.io/local-fixture: "true"
data:
  state: closed
  incident_id: ""
  opened_at: ""
  opened_by: ""
  reason: ""
  recovery_evidence_id: ""
  recovery_closed_at: ""
  recovery_closed_by: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: resilience-circuit-breaker-alert-receiver
  namespace: resilience-test
  labels:
    resilience.delivery-platform.io/local-fixture: "true"
type: Opaque
stringData:
  token: local-kind-resilience-webhook-token-0001
---
apiVersion: v1
kind: Secret
metadata:
  name: matrix-escalation-bridge-auth
  namespace: monitoring
  labels:
    resilience.delivery-platform.io/local-fixture: "true"
type: Opaque
stringData:
  token: local-kind-matrix-escalation-token-0001
---
apiVersion: v1
kind: Secret
metadata:
  name: wazuh-escalation-bridge-auth
  namespace: monitoring
  labels:
    resilience.delivery-platform.io/local-fixture: "true"
type: Opaque
stringData:
  token: local-kind-wazuh-escalation-token-0001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-escalation-bridge
  namespace: resilience-test
  labels:
    app.kubernetes.io/name: matrix-escalation-bridge
    resilience.delivery-platform.io/local-fixture: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-escalation-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-escalation-bridge
    spec:
      serviceAccountName: matrix-escalation-bridge
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mock-webhook
          image: deliveryplatform/local-mock-escalation-bridge:kind
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { cpu: 50m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-escalation-bridge
  namespace: resilience-test
  labels:
    app.kubernetes.io/name: matrix-escalation-bridge
spec:
  selector:
    app.kubernetes.io/name: matrix-escalation-bridge
  ports:
    - name: webhook
      port: 8080
      targetPort: http
---
