apiVersion: v1
kind: ServiceAccount
metadata:
  name: matrix-escalation-bridge
  namespace: resilience-test
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wazuh-escalation-bridge
  namespace: resilience-test
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: matrix-wazuh-escalation-readonly
  namespace: resilience-test
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: matrix-escalation-bridge-readonly
  namespace: resilience-test
subjects:
  - kind: ServiceAccount
    name: matrix-escalation-bridge
    namespace: resilience-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: matrix-wazuh-escalation-readonly
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wazuh-escalation-bridge-readonly
  namespace: resilience-test
subjects:
  - kind: ServiceAccount
    name: wazuh-escalation-bridge
    namespace: resilience-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: matrix-wazuh-escalation-readonly
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: matrix-escalation-bridge-isolation
  namespace: resilience-test
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: matrix-escalation-bridge
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 8443
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: matrix
      ports:
        - protocol: TCP
          port: 8448
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wazuh-escalation-bridge-isolation
  namespace: resilience-test
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wazuh-escalation-bridge
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 8443
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: wazuh
      ports:
        - protocol: TCP
          port: 55000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
