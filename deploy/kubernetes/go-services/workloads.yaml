apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-control
  namespace: switchos
  labels: &id001
    app.kubernetes.io/name: inventory-control
    app.kubernetes.io/component: go-service
    app.kubernetes.io/part-of: deliveryplatform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-control
  template:
    metadata:
      labels: *id001
      annotations:
        dapr.io/enabled: 'true'
        dapr.io/app-id: inventory-control
        dapr.io/app-port: '8117'
        dapr.io/config: switchos-dapr-config
    spec:
      serviceAccountName: go-services
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        minDomains: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: inventory-control
      containers:
      - name: inventory-control
        image: ghcr.io/munisp/deliveryplatform-inventory-control:REPLACE_WITH_IMMUTABLE_TAG
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8117
        envFrom:
        - configMapRef:
            name: go-services-runtime-config
        - secretRef:
            name: go-services-secrets
        env:
        - name: PORT
          value: '8117'
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 36
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-control
  namespace: switchos
  labels:
    app.kubernetes.io/name: inventory-control
    app.kubernetes.io/component: go-service
    app.kubernetes.io/part-of: deliveryplatform
spec:
  selector:
    app.kubernetes.io/name: inventory-control
  ports:
  - name: http
    port: 8117
    targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inventory-control
  namespace: switchos
  labels:
    app.kubernetes.io/name: inventory-control
    app.kubernetes.io/component: go-service
    app.kubernetes.io/part-of: deliveryplatform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-control
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inventory-control
  namespace: switchos
  labels:
    app.kubernetes.io/name: inventory-control
    app.kubernetes.io/component: go-service
    app.kubernetes.io/part-of: deliveryplatform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inventory-control
  minReplicas: 2
  maxReplicas: 5
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
