apiVersion: v1
kind: ConfigMap
metadata:
  name: go-services-runtime-config
  namespace: switchos
  labels:
    app.kubernetes.io/part-of: deliveryplatform
data:
  BIND_HOST: "0.0.0.0"
  KAFKA_BROKERS: "kafka.switchos.svc.cluster.local:9092"
  KAFKA_INVENTORY_TOPIC: "inventory-events"
  KAFKA_LOCAL_COMMERCE_TOPIC: "local-commerce-events"
  KAFKA_NOTIFICATION_TOPIC: "notification-events"
  FLUVIO_KAFKA_BROKERS: "fluvio.switchos.svc.cluster.local:9092"
  FLUVIO_INVENTORY_TOPIC: "inventory-events"
  FLUVIO_LOCAL_COMMERCE_TOPIC: "local-commerce-events"
  DAPR_PUBSUB_NAME: "switchos-bus"
  DAPR_INVENTORY_TOPIC: "inventory-events"
  DAPR_LOCAL_COMMERCE_TOPIC: "local-commerce-events"
  DAPR_FUNDS_TOPIC: "funds-events"
  TEMPORAL_ADDRESS: "temporal-frontend.switchos.svc.cluster.local:7233"
  TEMPORAL_NAMESPACE: "switchos"
  TEMPORAL_TASK_QUEUE: "switchos-workflows"
  TEMPORAL_BRIDGE_URL: "http://temporal-bridge.switchos.svc.cluster.local:8080"
  LONGCAT_CORE_URL: "http://central-app.switchos.svc.cluster.local:3005"
  LONGCAT_SPEECH_SERVICE_URL: "http://speech-runtime.switchos.svc.cluster.local:8105"
  LONGCAT_TELEPHONY_MODE: "asterisk-audiosocket"
  LONGCAT_AUDIOSOCKET_ADDR: "asterisk.switchos.svc.cluster.local:9104"
  MOJALOOP_SERVICE_MODE: "http"
  MOJALOOP_SWITCH_URL: "http://mojaloop-switch.switchos.svc.cluster.local:4001"
  MOJALOOP_PARTICIPANT_ID: "switchos"
  TIGERBEETLE_ADDRESSES: "tigerbeetle.switchos.svc.cluster.local:3000"
  TIGERBEETLE_CLUSTER_ID: "0"
---
# Template only. Exclude this document from kustomization and create it through
# the production secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: go-services-secrets
  namespace: switchos
  annotations:
    deliveryplatform.io/template-only: "true"
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_WITH_POSTGRESQL_TLS_DSN"
  INTERNAL_SERVICE_TOKEN: "REPLACE_WITH_UNIQUE_32_PLUS_CHARACTER_SECRET"
  REDIS_URL: "REPLACE_WITH_REDIS_TLS_URL"
  TIGERBEETLE_ACCOUNT_MAP_JSON: "REPLACE_WITH_ACCOUNT_MAP_JSON"
  MOJALOOP_AUTH_TOKEN: "REPLACE_WITH_MOJALOOP_CREDENTIAL"
  SMS_PROVIDER_URL: "REPLACE_WITH_SMS_PROVIDER_URL"
  EMAIL_PROVIDER_URL: "REPLACE_WITH_EMAIL_PROVIDER_URL"
  PUSH_PROVIDER_URL: "REPLACE_WITH_PUSH_PROVIDER_URL"
  VOICE_PROVIDER_URL: "REPLACE_WITH_VOICE_PROVIDER_URL"
