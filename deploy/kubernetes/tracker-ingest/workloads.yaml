apiVersion: v1
kind: ServiceAccount
metadata:
  name: vehicle-tracker-ingest
  namespace: switchos
  labels:
    app.kubernetes.io/name: vehicle-tracker-ingest
    app.kubernetes.io/component: tracker-worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vehicle-tracker-ingest-runtime-config
  namespace: switchos
  labels:
    app.kubernetes.io/name: vehicle-tracker-ingest
    app.kubernetes.io/component: tracker-worker
data:
  NODE_ENV: "production"
  ENABLE_VEHICLE_TRACKER_PROVIDER_CONSUMERS: "true"
  VEHICLE_TRACKER_CONSUMER_EMBEDDED: "false"
  VEHICLE_TRACKER_PROVIDER_POLL_INTERVAL_MS: "60000"
  VEHICLE_TRACKER_METRICS_NAMESPACE: "switchos"
  VEHICLE_TRACKER_DATABASE_POOL_MAX: "4"
  VEHICLE_TRACKER_WORKER_METRICS_PORT: "9464"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-tracker-ingest
  namespace: switchos
  labels:
    app.kubernetes.io/name: vehicle-tracker-ingest
    app.kubernetes.io/component: tracker-worker
spec:
  replicas: 16
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  selector:
    matchLabels:
      app.kubernetes.io/name: vehicle-tracker-ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vehicle-tracker-ingest
        app.kubernetes.io/component: tracker-worker
        app.kubernetes.io/part-of: deliveryplatform
    spec:
      serviceAccountName: vehicle-tracker-ingest
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: vehicle-tracker-ingest
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: vehicle-tracker-ingest
                topologyKey: kubernetes.io/hostname
      containers:
        - name: vehicle-tracker-ingest
          image: ghcr.io/munisp/deliveryplatform-central-app:REPLACE_WITH_IMMUTABLE_TAG
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/vehicleTrackerIngestWorker.js"]
          ports:
            - name: metrics
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: vehicle-tracker-ingest-runtime-config
            - secretRef:
                name: vehicle-tracker-ingest-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vehicle-tracker-pgbouncer-client
                  key: connection-string
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: vehicle-tracker-ingest
  namespace: switchos
  labels:
    app.kubernetes.io/name: vehicle-tracker-ingest
    app.kubernetes.io/component: tracker-worker
spec:
  selector:
    app.kubernetes.io/name: vehicle-tracker-ingest
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vehicle-tracker-ingest
  namespace: switchos
spec:
  maxUnavailable: 25%
  selector:
    matchLabels:
      app.kubernetes.io/name: vehicle-tracker-ingest
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vehicle-tracker-ingest
  namespace: switchos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vehicle-tracker-ingest
  minReplicas: 16
  maxReplicas: 64
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vehicle-tracker-ingest-restrict-network
  namespace: switchos
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vehicle-tracker-ingest
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9464
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: switchos
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Standard Kubernetes NetworkPolicy has no portable FQDN selector. This is
    # intentionally constrained to HTTPS; production must additionally enforce
    # vendor endpoint allowlists at a DNS-aware egress gateway or CNI layer.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
