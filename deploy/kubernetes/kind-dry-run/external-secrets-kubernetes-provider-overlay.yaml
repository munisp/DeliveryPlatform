# Test-only overlay. Kubernetes Secret names cannot contain '/', whereas the
# production manifest intentionally uses provider-neutral logical secret paths.
# This overlay changes only remoteRef keys for the local Kubernetes provider.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: switchos-runtime-secrets
  namespace: switchos
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: deliveryplatform-secrets
  target:
    name: switchos-runtime-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: runtime-source
