apiVersion: v1
kind: Namespace
metadata:
  name: deliveryplatform-secrets-source
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-source-reader
  namespace: deliveryplatform-secrets-source
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-source-reader
  namespace: deliveryplatform-secrets-source
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["runtime-source", "central-app-source", "go-services-source", "python-services-source"]
    verbs: ["get"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-source-reader
  namespace: deliveryplatform-secrets-source
subjects:
  - kind: ServiceAccount
    name: external-secrets-source-reader
    namespace: deliveryplatform-secrets-source
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-source-reader
---
apiVersion: v1
kind: Secret
metadata:
  name: runtime-source
  namespace: deliveryplatform-secrets-source
type: Opaque
stringData:
  DATABASE_URL: "postgresql://dry-run:dry-run@postgres.switchos.svc.cluster.local:5432/dry_run?sslmode=require"
  INTERNAL_SERVICE_TOKEN: "dry-run-secret-not-for-production-0123456789"
---
apiVersion: v1
kind: Secret
metadata:
  name: central-app-source
  namespace: deliveryplatform-secrets-source
type: Opaque
stringData:
  DATABASE_URL: "postgresql://dry-run:dry-run@postgres.switchos.svc.cluster.local:5432/dry_run?sslmode=require"
  JWT_SECRET: "dry-run-jwt-secret-not-for-production-012345"
  INTERNAL_SERVICE_TOKEN: "dry-run-secret-not-for-production-0123456789"
  BOOTSTRAP_OPERATOR_PASSWORD: "DryRunOnly-NotProduction-123!"
  PERMIFY_AUTH_TOKEN: "dry-run-permify-token"
  OPA_AUTH_TOKEN: "dry-run-opa-token"
  OIDC_CLIENT_SECRET: "dry-run-oidc-client-secret"
  APISIX_ADMIN_KEY: "dry-run-apisix-key"
  OPENSEARCH_USERNAME: "dry-run"
  OPENSEARCH_PASSWORD: "dry-run-opensearch-password"
  DATABASE_SSL_CA: "DRY_RUN_CA"
---
apiVersion: v1
kind: Secret
metadata:
  name: go-services-source
  namespace: deliveryplatform-secrets-source
type: Opaque
stringData:
  DATABASE_URL: "postgresql://dry-run:dry-run@postgres.switchos.svc.cluster.local:5432/dry_run?sslmode=require"
  INTERNAL_SERVICE_TOKEN: "dry-run-secret-not-for-production-0123456789"
  TIGERBEETLE_ACCOUNT_MAP_JSON: "{}"
  MOJALOOP_AUTH_TOKEN: "dry-run-mojaloop-token"
  SMS_PROVIDER_URL: "https://example.invalid/sms"
  EMAIL_PROVIDER_URL: "https://example.invalid/email"
  PUSH_PROVIDER_URL: "https://example.invalid/push"
  VOICE_PROVIDER_URL: "https://example.invalid/voice"
---
apiVersion: v1
kind: Secret
metadata:
  name: python-services-source
  namespace: deliveryplatform-secrets-source
type: Opaque
stringData:
  DATABASE_URL: "postgresql://dry-run:dry-run@postgres.switchos.svc.cluster.local:5432/dry_run?sslmode=require"
  INTERNAL_SERVICE_TOKEN: "dry-run-secret-not-for-production-0123456789"
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: deliveryplatform-secrets
spec:
  conditions:
    - namespaces: ["switchos"]
  provider:
    kubernetes:
      remoteNamespace: deliveryplatform-secrets-source
      server:
        url: "https://172.18.0.4:6443"
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: deliveryplatform-secrets-source
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets-source-reader
          namespace: deliveryplatform-secrets-source
