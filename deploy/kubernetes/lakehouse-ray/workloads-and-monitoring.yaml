# Ray training manifests are signed offline and mounted read-only. This package
# assumes KubeRay is installed separately and an image built from the pinned
# Dockerfile.manifest-exporter has been published by the repository CI pipeline.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakehouse-training-manifest-exporter
  namespace: switchos
  labels:
    app.kubernetes.io/name: lakehouse-training-manifest-exporter
    app.kubernetes.io/component: ml-governance
    app.kubernetes.io/part-of: deliveryplatform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: lakehouse-training-manifest-exporter }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lakehouse-training-manifest-exporter
        app.kubernetes.io/component: ml-governance
        app.kubernetes.io/part-of: deliveryplatform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: manifest-exporter
          # CI must replace this digest only after provenance and vulnerability gates.
          image: ghcr.io/munisp/deliveryplatform-lakehouse-manifest-exporter@sha256:REPLACE_WITH_VERIFIED_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          ports: [{ name: metrics, containerPort: 9470 }]
          env:
            - { name: LAKEHOUSE_TRAINING_MANIFEST_PATH, value: /var/run/lakehouse/approved-manifest.json }
            - { name: LAKEHOUSE_TRAINING_MANIFEST_METRICS_PORT, value: "9470" }
            - name: LAKEHOUSE_TRAINING_SIGNER_KEYS_JSON
              valueFrom: { secretKeyRef: { name: lakehouse-training-signer-keys, key: public-keys.json } }
          volumeMounts:
            - { name: approved-manifest, mountPath: /var/run/lakehouse, readOnly: true }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe: { httpGet: { path: /metrics, port: metrics }, periodSeconds: 15, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /metrics, port: metrics }, periodSeconds: 30, timeoutSeconds: 3 }
      volumes:
        - name: approved-manifest
          secret: { secretName: lakehouse-approved-training-manifest }
---
apiVersion: v1
kind: Service
metadata:
  name: lakehouse-training-manifest-exporter
  namespace: switchos
  labels:
    app.kubernetes.io/name: lakehouse-training-manifest-exporter
    app.kubernetes.io/component: ml-governance
    app.kubernetes.io/part-of: deliveryplatform
spec:
  selector: { app.kubernetes.io/name: lakehouse-training-manifest-exporter }
  ports: [{ name: metrics, port: 9470, targetPort: metrics }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lakehouse-training-manifest-exporter
  namespace: switchos
  labels: { release: prometheus, app.kubernetes.io/part-of: deliveryplatform }
spec:
  namespaceSelector: { matchNames: [switchos] }
  selector: { matchLabels: { app.kubernetes.io/name: lakehouse-training-manifest-exporter } }
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 5s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lakehouse-ray-ingestion-alerts
  namespace: switchos
  labels: { release: prometheus, app.kubernetes.io/part-of: deliveryplatform }
spec:
  groups:
    - name: deliveryplatform.lakehouse-ray.ingestion
      interval: 30s
      rules:
        - alert: DeliveryPlatformRayTrainingManifestInvalid
          expr: min(deliveryplatform_lakehouse_training_manifest_valid) < 1
          for: 2m
          labels: { severity: critical, component: ml-governance }
          annotations:
            summary: Approved Ray training manifest is absent, altered, or not signed by an approved key
            description: New training must remain blocked until the governed snapshot manifest and signer-key configuration are restored.
        - alert: DeliveryPlatformRayTrainingManifestLagHigh
          expr: max(deliveryplatform_lakehouse_training_manifest_age_seconds) > 21600
          for: 15m
          labels: { severity: warning, component: ml-governance }
          annotations:
            summary: Approved Ray training snapshot is older than six hours
            description: Inspect governed exporter completion and catalog snapshot generation; do not train from raw operational stores.
        - alert: DeliveryPlatformRayTrainingManifestExporterUnavailable
          expr: absent(deliveryplatform_lakehouse_training_manifest_valid)
          for: 2m
          labels: { severity: critical, component: ml-governance }
          annotations:
            summary: Ray training manifest monitoring is unavailable
            description: Monitoring cannot establish whether the mounted training input remains authenticated or fresh.
        - alert: DeliveryPlatformRayTrainingJobFailed
          expr: max(kube_rayjob_status{state="FAILED"}) > 0
          for: 1m
          labels: { severity: critical, component: ml-training }
          annotations:
            summary: A governed Ray training job failed
            description: Preserve the immutable manifest digest and Ray job logs before retrying; do not silently replace training data.
---
# Template only: commit an approved signed manifest secret and a digest-pinned
# trainer image before creating a concrete RayJob. The job takes no raw database
# credentials; it reads only the mounted signed manifest and object-store access.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: mobility-risk-training-approved-snapshot
  namespace: switchos
  labels:
    app.kubernetes.io/name: mobility-risk-training
    app.kubernetes.io/component: ml-training
    app.kubernetes.io/part-of: deliveryplatform
spec:
  entrypoint: >-
    python /app/train_mobility_risk_model.py
    --manifest /var/run/lakehouse/approved-manifest.json
    --snapshot-ref ${SNAPSHOT_REF}
    --feature-set-version v1
    --feature-policy-version v1
    --redaction-profile governed-v1
    --training-cutoff-date ${TRAINING_CUTOFF_DATE}
    --epochs 5 --workers 2 --batch-size 512 --prefetch-batches 2
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 86400
  rayClusterSpec:
    rayVersion: "2.52.1"
    headGroupSpec:
      rayStartParams: { dashboard-host: "0.0.0.0" }
      template:
        spec:
          containers:
            - name: ray-head
              image: ghcr.io/munisp/deliveryplatform-lakehouse-ray-trainer@sha256:REPLACE_WITH_VERIFIED_IMAGE_DIGEST
              resources: { requests: { cpu: "2", memory: 4Gi }, limits: { cpu: "4", memory: 8Gi } }
    workerGroupSpecs:
      - groupName: trainer
        replicas: 2
        minReplicas: 0
        maxReplicas: 8
        rayStartParams: {}
        template:
          spec:
            containers:
              - name: ray-worker
                image: ghcr.io/munisp/deliveryplatform-lakehouse-ray-trainer@sha256:REPLACE_WITH_VERIFIED_IMAGE_DIGEST
                resources: { requests: { cpu: "2", memory: 4Gi }, limits: { cpu: "4", memory: 8Gi } }
