apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: resilience-circuit-breaker-alert-receiver
  namespace: resilience-test
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-staging-secrets
  target:
    name: resilience-circuit-breaker-alert-receiver
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: token
      remoteRef:
        key: deliveryplatform/staging/resilience/circuit-breaker-alert-receiver
        property: token
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: resilience-circuit-breaker-alert-receiver-tls
  namespace: resilience-test
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-staging-secrets
  target:
    name: resilience-circuit-breaker-alert-receiver-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: deliveryplatform/staging/resilience/circuit-breaker-alert-receiver-tls
        property: tls_crt
    - secretKey: tls.key
      remoteRef:
        key: deliveryplatform/staging/resilience/circuit-breaker-alert-receiver-tls
        property: tls_key
