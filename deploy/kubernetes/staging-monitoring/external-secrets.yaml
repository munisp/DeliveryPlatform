apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: matrix-escalation-bridge-auth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-staging-secrets
  target:
    name: matrix-escalation-bridge-auth
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: token
      remoteRef:
        key: deliveryplatform/staging/resilience/matrix-escalation-bridge
        property: token
---
