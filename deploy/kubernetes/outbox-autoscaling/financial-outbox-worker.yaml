apiVersion: apps/v1
kind: Deployment
metadata:
  name: mojaloop-funds-outbox
  namespace: switchos
  labels:
    app.kubernetes.io/name: mojaloop-funds-outbox
    app.kubernetes.io/component: financial-dispatch
    app.kubernetes.io/part-of: deliveryplatform
spec:
  # KEDA is the sole controller after the ScaledObject is reconciled.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mojaloop-funds-outbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mojaloop-funds-outbox
        app.kubernetes.io/component: financial-dispatch
        app.kubernetes.io/part-of: deliveryplatform
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: mojaloop-funds-outbox
        dapr.io/app-port: "8086"
        dapr.io/config: switchos-dapr-config
    spec:
      serviceAccountName: go-services
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mojaloop-funds-outbox
      containers:
        - name: mojaloop-funds-outbox
          image: ghcr.io/munisp/deliveryplatform-mojaloop:REPLACE_WITH_IMMUTABLE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
          envFrom:
            - configMapRef:
                name: go-services-runtime-config
            - secretRef:
                name: go-services-secrets
          env:
            - name: HTTP_PORT
              value: "8086"
            - name: BIND_HOST
              value: "0.0.0.0"
            - name: MOJALOOP_SERVICE_MODE
              value: outbox-worker
            - name: MOJALOOP_DATABASE_POOL_MAX
              value: "4"
            - name: FUNDS_OUTBOX_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 36
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mojaloop-funds-outbox
  namespace: switchos
  labels:
    app.kubernetes.io/name: mojaloop-funds-outbox
    app.kubernetes.io/component: financial-dispatch
    app.kubernetes.io/part-of: deliveryplatform
spec:
  selector:
    app.kubernetes.io/name: mojaloop-funds-outbox
  ports:
    - name: http
      port: 8086
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mojaloop-funds-outbox
  namespace: switchos
  labels:
    app.kubernetes.io/name: mojaloop-funds-outbox
    app.kubernetes.io/component: financial-dispatch
    app.kubernetes.io/part-of: deliveryplatform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mojaloop-funds-outbox
