apiVersion: v1
kind: ServiceAccount
metadata:
  name: financial-dispatcher-pgbouncer
  namespace: switchos
  labels:
    app.kubernetes.io/name: financial-dispatcher-pgbouncer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: financial-dispatcher-pgbouncer-config
  namespace: switchos
  labels:
    app.kubernetes.io/name: financial-dispatcher-pgbouncer
data:
  pgbouncer.ini: |
    [databases]
    # The database host is deliberately an externally managed endpoint; set it
    # from the deployment overlay only after the PostgreSQL connection budget is
    # approved. Transaction pooling is safe for this Go dispatcher because it
    # does not rely on session state, prepared statements, or advisory locks.
    deliveryplatform = host=REPLACE_WITH_FINANCIAL_POSTGRES_SERVICE port=5432 dbname=deliveryplatform pool_size=24 reserve_pool_size=4 max_db_connections=28 max_db_client_connections=160

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    pool_mode = transaction
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer-auth/userlist.txt
    stats_users = financial_pgbouncer_exporter
    max_client_conn = 192
    default_pool_size = 24
    min_pool_size = 8
    reserve_pool_size = 4
    reserve_pool_timeout = 2
    max_db_connections = 28
    max_db_client_connections = 160
    server_connect_timeout = 5
    server_login_retry = 5
    query_wait_timeout = 10
    server_idle_timeout = 60
    server_lifetime = 1800
    server_reset_query = DISCARD ALL
    max_prepared_statements = 0
    ignore_startup_parameters = extra_float_digits
    client_tls_sslmode = require
    client_tls_key_file = /etc/pgbouncer-tls/tls.key
    client_tls_cert_file = /etc/pgbouncer-tls/tls.crt
    client_tls_ca_file = /etc/pgbouncer-tls/ca.crt
    server_tls_sslmode = verify-full
    server_tls_ca_file = /etc/pgbouncer-tls/ca.crt
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: financial-dispatcher-postgresql-budget
  namespace: switchos
data:
  postgresql-financial.conf: |
    # Mount this reviewed fragment through the PostgreSQL operator/StatefulSet
    # overlay. Do not apply it blindly: the aggregate PgBouncer cap below must
    # fit within max_connections after replication, migration, monitoring, and
    # administrator reserves are deducted.
    max_connections = 150
    superuser_reserved_connections = 10
    statement_timeout = '15s'
    idle_in_transaction_session_timeout = '5s'
    lock_timeout = '2s'
    deadlock_timeout = '250ms'
    log_lock_waits = on
    log_min_duration_statement = '500ms'
    # Keep autovacuum enabled; tune worker count and cost settings from actual
    # table growth/WAL evidence rather than a static manifest default.
    autovacuum = on
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: financial-dispatcher-pgbouncer
  namespace: switchos
  labels:
    app.kubernetes.io/name: financial-dispatcher-pgbouncer
    app.kubernetes.io/component: postgres-transaction-pooler
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: financial-dispatcher-pgbouncer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: financial-dispatcher-pgbouncer
        app.kubernetes.io/component: postgres-transaction-pooler
        app.kubernetes.io/part-of: deliveryplatform
    spec:
      serviceAccountName: financial-dispatcher-pgbouncer
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: financial-dispatcher-pgbouncer
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:REPLACE_WITH_IMMUTABLE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 6432
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
              readOnly: true
            - name: auth
              mountPath: /etc/pgbouncer-auth
              readOnly: true
            - name: tls
              mountPath: /etc/pgbouncer-tls
              readOnly: true
            - name: runtime
              mountPath: /var/run/pgbouncer
          readinessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
        - name: pgbouncer-exporter
          image: quay.io/prometheuscommunity/pgbouncer-exporter:REPLACE_WITH_IMMUTABLE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9127
          env:
            - name: PGBOUNCER_EXPORTER_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: financial-dispatcher-pgbouncer-exporter
                  key: connection-string
          args:
            - --web.config.file=/etc/pgbouncer-exporter/web-config.yml
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: exporter-web
              mountPath: /etc/pgbouncer-exporter
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: financial-dispatcher-pgbouncer-config
        - name: auth
          secret:
            name: financial-dispatcher-pgbouncer-auth
        - name: tls
          secret:
            name: financial-dispatcher-pgbouncer-tls
        - name: exporter-web
          secret:
            name: financial-dispatcher-pgbouncer-exporter-web
        - name: runtime
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: financial-dispatcher-pgbouncer
  namespace: switchos
  labels:
    app.kubernetes.io/name: financial-dispatcher-pgbouncer
spec:
  selector:
    app.kubernetes.io/name: financial-dispatcher-pgbouncer
  ports:
    - name: postgres
      port: 6432
      targetPort: postgres
    - name: metrics
      port: 9127
      targetPort: metrics
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: financial-dispatcher-pgbouncer
  namespace: switchos
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: financial-dispatcher-pgbouncer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: financial-dispatcher-pgbouncer
  namespace: switchos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: financial-dispatcher-pgbouncer
  minReplicas: 3
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
# Required externally managed secrets:
# - financial-dispatcher-pgbouncer-auth: SCRAM userlist for the financial worker
#   and exporter; do not reuse tracker or application roles.
# - financial-dispatcher-pgbouncer-tls: client/server TLS certificate/key/CA.
# - financial-dispatcher-pgbouncer-exporter: local PgBouncer admin connection.
# - financial-dispatcher-pgbouncer-exporter-web: exporter HTTPS configuration.
#
# Connection budget: 3 poolers × 28 backend connections = 84 potential
# PostgreSQL financial-session connections. With max_connections=150, reserve
# 10 superuser/admin, 20 migration/maintenance/replication, and 36 application
# headroom. This is a configuration starting point only; approve only after a
# production-like load rehearsal shows low queue wait, lock contention, and
# reconciliation latency within SLO.
