# Requires External Secrets Operator and a pre-provisioned ClusterSecretStore
# named deliveryplatform-secrets. The external secret paths are provider-neutral
# logical names; configure their backing provider outside this repository.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: switchos-runtime-secrets
  namespace: switchos
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: deliveryplatform-secrets
  target:
    name: switchos-runtime-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: deliveryplatform/runtime
