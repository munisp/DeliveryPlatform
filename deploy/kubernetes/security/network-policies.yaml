apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress-egress
  namespace: switchos
  labels:
    app.kubernetes.io/part-of: deliveryplatform
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# Prometheus is allowed to reach declared HTTP ports only. Application-specific
# NetworkPolicies must still grant any other ingress path.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: switchos
  labels:
    app.kubernetes.io/part-of: deliveryplatform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: deliveryplatform
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3005
        - protocol: TCP
          port: 8007
        - protocol: TCP
          port: 8086
        - protocol: TCP
          port: 8090
        - protocol: TCP
          port: 8099
        - protocol: TCP
          port: 8101
        - protocol: TCP
          port: 8104
        - protocol: TCP
          port: 8105
        - protocol: TCP
          port: 8112
        - protocol: TCP
          port: 8113
        - protocol: TCP
          port: 8114
        - protocol: TCP
          port: 8115
        - protocol: TCP
          port: 8116
        - protocol: TCP
          port: 8117
