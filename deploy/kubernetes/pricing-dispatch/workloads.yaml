  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pricing-dispatch-restrict-ingress
  namespace: switchos
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["pricing-engine", "dispatch-optimizer", "work-record-signer"]
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: switchos
          podSelector:
            matchLabels:
              app.kubernetes.io/name: central-app
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: switchos
          podSelector:
            matchLabels:
              app.kubernetes.io/component: go-service
      ports:
        - protocol: TCP
          port: 8101
        - protocol: TCP
          port: 8090
        - protocol: TCP
          port: 8109
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: switchos
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
