apiVersion: v1
kind: Namespace
metadata:
  name: switchos
  labels:
    app.kubernetes.io/part-of: deliveryplatform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-engine
  namespace: switchos
  labels:
    app.kubernetes.io/name: pricing-engine
    app.kubernetes.io/part-of: deliveryplatform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: pricing-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pricing-engine
        app.kubernetes.io/part-of: deliveryplatform
    spec:
      serviceAccountName: pricing-dispatch
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pricing-engine
      containers:
        - name: pricing-engine
          image: ghcr.io/munisp/deliveryplatform-pricing-engine:REPLACE_WITH_IMMUTABLE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8101
          envFrom:
            - configMapRef:
                name: pricing-dispatch-runtime-config
            - secretRef:
                name: switchos-runtime-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-engine
  namespace: switchos
spec:
  selector:
    app.kubernetes.io/name: pricing-engine
  ports:
    - name: http
      port: 8101
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pricing-engine
  namespace: switchos
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pricing-engine
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pricing-engine
  namespace: switchos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pricing-engine
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
