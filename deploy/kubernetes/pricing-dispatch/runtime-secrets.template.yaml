apiVersion: v1
kind: ConfigMap
metadata:
  name: pricing-dispatch-runtime-config
  namespace: switchos
  labels:
    app.kubernetes.io/part-of: deliveryplatform
data:
  BIND_HOST: "0.0.0.0"
  RUST_LOG: "info"
  DATABASE_POOL_MAX_SIZE: "8"
---
# Template only. Do not add this file to kustomization resources or apply it with
# placeholder values. Create this Secret with the production secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: switchos-runtime-secrets
  namespace: switchos
  annotations:
    deliveryplatform.io/template-only: "true"
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_WITH_POSTGRESQL_TLS_DSN"
  INTERNAL_SERVICE_TOKEN: "REPLACE_WITH_UNIQUE_32_PLUS_CHARACTER_SECRET"
  WORK_RECORD_SIGNER_SEED: "REPLACE_WITH_64_HEX_CHARACTER_SIGNING_SEED"
  WORK_RECORD_SIGNER_TOKEN: "REPLACE_WITH_UNIQUE_32_PLUS_CHARACTER_SECRET"
