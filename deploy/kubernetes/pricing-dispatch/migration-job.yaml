apiVersion: batch/v1
kind: Job
metadata:
  name: deliveryplatform-schema-migration
  namespace: switchos
  labels:
    app.kubernetes.io/name: deliveryplatform-schema-migration
    app.kubernetes.io/part-of: deliveryplatform
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deliveryplatform-schema-migration
    spec:
      restartPolicy: Never
      serviceAccountName: schema-migrator
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/munisp/deliveryplatform-migrations:REPLACE_WITH_IMMUTABLE_TAG
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: switchos-runtime-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
