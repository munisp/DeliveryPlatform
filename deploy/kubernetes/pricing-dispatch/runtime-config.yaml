apiVersion: v1
kind: ConfigMap
metadata:
  name: pricing-dispatch-runtime-config
  namespace: switchos
  labels:
    app.kubernetes.io/part-of: deliveryplatform
data:
  BIND_HOST: "0.0.0.0"
  RUST_LOG: "info"
  # At two minimum replicas per service, this reserves 16 connections. With
  # the HPA maximum of five replicas per service, pricing and dispatch use at
  # most 40 connections and leave capacity for migrations and other services.
  DATABASE_POOL_MAX_SIZE: "4"
