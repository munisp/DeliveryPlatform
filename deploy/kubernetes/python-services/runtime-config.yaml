apiVersion: v1
kind: ConfigMap
metadata:
  name: python-services-runtime-config
  namespace: switchos
  labels:
    app.kubernetes.io/part-of: deliveryplatform
data:
  BIND_HOST: "0.0.0.0"
  ALLOWED_ORIGINS: "https://REPLACE_WITH_PUBLIC_APP_HOST"
  LOCAL_COMMERCE_ENABLE_TRACING: "true"
  LONGCAT_SPEECH_STT_ENGINE: "faster-whisper"
  LONGCAT_SPEECH_TTS_ENGINE: "piper"
  LONGCAT_SPEECH_STT_DEVICE: "cpu"
  LONGCAT_SPEECH_STT_COMPUTE_TYPE: "int8"
  LONGCAT_SPEECH_STREAM_TIMEOUT_SECONDS: "30"
  PAYMENT_WEBHOOK_SIGNATURE_HEADER: "x-paystack-signature"
  PAYOUTS_ENABLED: "false"
  PAYOUT_RELEASE_INTERVAL_SECONDS: "15"
  PAYOUT_HOLD_MINUTES: "60"
  PAYMENT_PROVIDER_TIMEOUT_SECONDS: "8"
  PAYMENT_DB_POOL_MAX_SIZE: "16"
  PAYMENT_WEBHOOK_VERIFY_INTERVAL_SECONDS: "1"
  PAYMENT_WEBHOOK_VERIFY_BATCH_SIZE: "50"
  PAYMENT_WEBHOOK_MAX_ATTEMPTS: "8"
  COMPLIANCE_MAX_ELIGIBILITY_DAYS: "30"
  COMPLIANCE_PROVIDER_TIMEOUT_SECONDS: "8"
  COMPLIANCE_OPERATOR_SUBJECT_KEY: "lagos-private-beta"
