apiVersion: v1
kind: ConfigMap
metadata:
  name: python-services-runtime-config
  namespace: switchos
  labels:
    app.kubernetes.io/part-of: deliveryplatform
data:
  BIND_HOST: "0.0.0.0"
  ALLOWED_ORIGINS: "https://REPLACE_WITH_PUBLIC_APP_HOST"
  LOCAL_COMMERCE_ENABLE_TRACING: "true"
  LONGCAT_SPEECH_STT_ENGINE: "faster-whisper"
  LONGCAT_SPEECH_TTS_ENGINE: "piper"
  LONGCAT_SPEECH_STT_DEVICE: "cpu"
  LONGCAT_SPEECH_STT_COMPUTE_TYPE: "int8"
  LONGCAT_SPEECH_STREAM_TIMEOUT_SECONDS: "30"
---
# Template only. Exclude this document from kustomization and create it through
# the production secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: python-services-secrets
  namespace: switchos
  annotations:
    deliveryplatform.io/template-only: "true"
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_WITH_POSTGRESQL_TLS_DSN"
  INTERNAL_SERVICE_TOKEN: "REPLACE_WITH_UNIQUE_32_PLUS_CHARACTER_SECRET"
  PAYMENT_PROVIDER_NAME: "REPLACE_WITH_CBN_LICENSED_PROVIDER_IDENTIFIER"
  PAYMENT_WEBHOOK_SECRET: "REPLACE_WITH_PROVIDER_WEBHOOK_SIGNING_SECRET"
  PAYMENT_PROVIDER_API_KEY: "REPLACE_WITH_PROVIDER_SERVER_API_KEY"
  PAYMENT_VERIFY_URL_TEMPLATE: "https://REPLACE_WITH_PROVIDER_API/transaction/verify/{reference}"
  PAYMENT_TRANSFER_VERIFY_URL_TEMPLATE: "https://REPLACE_WITH_PROVIDER_API/transfer/verify/{reference}"
  PAYMENT_TRANSFER_SUBMIT_URL: "https://REPLACE_WITH_PROVIDER_API/transfer"
  COMPLIANCE_PROVIDER_NAME: "REPLACE_WITH_APPROVED_VERIFIER_IDENTIFIER"
  COMPLIANCE_PROVIDER_VERIFY_URL: "https://REPLACE_WITH_APPROVED_VERIFIER_API/evidence/verify"
  COMPLIANCE_PROVIDER_HMAC_SECRET: "REPLACE_WITH_VERIFIER_RESPONSE_HMAC_SECRET"
