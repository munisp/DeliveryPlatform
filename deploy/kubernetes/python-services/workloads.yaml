apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-runtime
  namespace: switchos
  labels: &id001
    app.kubernetes.io/name: speech-runtime
    app.kubernetes.io/component: python-service
    app.kubernetes.io/part-of: deliveryplatform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: speech-runtime
  template:
    metadata:
      labels: *id001
      annotations: {}
    spec:
      serviceAccountName: python-services
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        minDomains: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: speech-runtime
      containers:
      - name: speech-runtime
        image: ghcr.io/munisp/deliveryplatform-speech-runtime:REPLACE_WITH_IMMUTABLE_TAG
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8105
        envFrom:
        - configMapRef:
            name: python-services-runtime-config
        - secretRef:
            name: python-services-secrets
        env:
        - name: PORT
          value: '8105'
        - name: PIPER_BIN
          value: /opt/speech-models/piper
        - name: PIPER_MODEL
          value: /opt/speech-models/en_US-lessac-medium.onnx
        - name: LONGCAT_SPEECH_STT_MODEL
          value: /opt/speech-models/whisper
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 36
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: speech-models
          mountPath: /opt/speech-models
          readOnly: true
      volumes:
      - name: speech-models
        persistentVolumeClaim:
          claimName: speech-runtime-models
---
