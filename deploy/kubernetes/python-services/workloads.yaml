metadata:
  name: compliance-review
  namespace: switchos
  labels:
    app.kubernetes.io/name: compliance-review
    app.kubernetes.io/component: python-service
    app.kubernetes.io/part-of: deliveryplatform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: compliance-review
  minReplicas: 2
  maxReplicas: 5
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: python-service-restrict-traffic
  namespace: switchos
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: python-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: switchos
      podSelector:
        matchLabels:
          app.kubernetes.io/name: central-app
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: switchos
      podSelector:
        matchLabels:
          app.kubernetes.io/component: go-service
    ports:
    - protocol: TCP
      port: 8007
    - protocol: TCP
      port: 8105
    - protocol: TCP
      port: 8113
    - protocol: TCP
      port: 8115
    - protocol: TCP
      port: 8116
    - protocol: TCP
      port: 8122
    - protocol: TCP
      port: 8125
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: switchos
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 8121
    - protocol: TCP
      port: 8125
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dapr-system
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 50001
    - protocol: TCP
      port: 50005
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ride-payment-webhook-ingress
  namespace: switchos
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ride-payment-webhook
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8122
