apiVersion: apps/v1
kind: Deployment
metadata:
  name: intake-orchestrator
  namespace: switchos
  labels: &id001
    app.kubernetes.io/name: intake-orchestrator
    app.kubernetes.io/component: python-service
    app.kubernetes.io/part-of: deliveryplatform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: intake-orchestrator
  template:
    metadata:
      labels: *id001
      annotations: {}
    spec:
      serviceAccountName: python-services
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        minDomains: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: intake-orchestrator
      containers:
      - name: intake-orchestrator
        image: ghcr.io/munisp/deliveryplatform-intake-orchestrator:REPLACE_WITH_IMMUTABLE_TAG
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8113
        envFrom:
        - configMapRef:
            name: python-services-runtime-config
        - secretRef:
            name: python-services-secrets
        env:
        - name: PORT
          value: '8113'
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 36
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: intake-orchestrator
  namespace: switchos
  labels:
    app.kubernetes.io/name: intake-orchestrator
    app.kubernetes.io/component: python-service
    app.kubernetes.io/part-of: deliveryplatform
spec:
  selector:
    app.kubernetes.io/name: intake-orchestrator
  ports:
  - name: http
    port: 8113
    targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: intake-orchestrator
  namespace: switchos
  labels:
    app.kubernetes.io/name: intake-orchestrator
    app.kubernetes.io/component: python-service
    app.kubernetes.io/part-of: deliveryplatform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: intake-orchestrator
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: intake-orchestrator
  namespace: switchos
  labels:
    app.kubernetes.io/name: intake-orchestrator
    app.kubernetes.io/component: python-service
    app.kubernetes.io/part-of: deliveryplatform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: intake-orchestrator
  minReplicas: 2
  maxReplicas: 5
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
