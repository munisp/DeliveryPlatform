version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: switchos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: switchos
      POSTGRES_USER: switchos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../scripts/init-local-postgres.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchos -d switchos"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: switchos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    volumes:
      - redis_data:/data

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: switchos-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "false"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?OPENSEARCH_INITIAL_ADMIN_PASSWORD must be set}
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  permify:
    image: ghcr.io/permify/permify:v1.7.2
    container_name: switchos-permify
    restart: unless-stopped
    command: ["serve"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: postgresql://switchos:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/switchos?sslmode=disable
      PERMIFY_DATABASE_AUTO_MIGRATE: "true"
      PERMIFY_AUTHN_ENABLED: "true"
      PERMIFY_AUTHN_METHOD: preshared
      PERMIFY_AUTHN_PRESHARED_KEYS: ${PERMIFY_AUTHN_PRESHARED_KEYS:?PERMIFY_AUTHN_PRESHARED_KEYS must be set}
      PERMIFY_LOG_OUTPUT: json
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:3478"]
      interval: 10s
      timeout: 5s
      retries: 12

  opa:
    image: openpolicyagent/opa:0.68.0-static
    container_name: switchos-opa
    restart: unless-stopped
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies/switchos.rego"]
    volumes:
      - ../authorization/opa/switchos.rego:/policies/switchos.rego:ro
    healthcheck:
      test: ["CMD", "/opa", "eval", "--format=raw", "data.switchos.authz.allow"]
      interval: 10s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: switchos-keycloak
    restart: unless-stopped
    command:
      - start
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN must be set}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/switchos
      KC_DB_USERNAME: switchos
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${SWITCHOS_AUTH_HOST:-auth.localhost}
      KC_HOSTNAME_STRICT: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../identity/keycloak-realm-switchos.json:/opt/keycloak/data/import/switchos-realm.json:ro

  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.17
    container_name: switchos-etcd
    restart: unless-stopped
    environment:
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379

  apisix:
    image: apache/apisix:3.10.0-debian
    container_name: switchos-apisix
    restart: unless-stopped
    depends_on:
      - etcd
    environment:
      APISIX_STAND_ALONE: "true"
    volumes:
      - ../gateway/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../gateway/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro

  caddy:
    image: caddy:2.8
    container_name: switchos-caddy
    restart: unless-stopped
    depends_on:
      - apisix
      - keycloak
      - opa
    environment:
      SWITCHOS_PUBLIC_HOST: ${SWITCHOS_PUBLIC_HOST:?SWITCHOS_PUBLIC_HOST must be set}
      SWITCHOS_AUTH_HOST: ${SWITCHOS_AUTH_HOST:?SWITCHOS_AUTH_HOST must be set}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../gateway/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
  caddy_data:
  caddy_config:
