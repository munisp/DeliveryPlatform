routes:
  - id: switchos-web
    name: switchos-web
    uri: /
    methods: ["GET"]
    priority: 100
    plugins:
      proxy-rewrite:
        headers:
          set:
            Cache-Control: "no-cache, no-store, must-revalidate"
            Pragma: "no-cache"
            Expires: "0"
            X-Forwarded-Proto: "https"
      response-rewrite:
        headers:
          Cache-Control: "no-cache, no-store, must-revalidate"
          Pragma: "no-cache"
          Expires: "0"
    upstream:
      type: roundrobin
      nodes:
        "host.docker.internal:3005": 1

  - id: switchos-api
    name: switchos-api
    uri: /api/*
    methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
    priority: 200
    plugins:
      cors:
        allow_origins: "https://switchos.localhost,https://localhost,https://127.0.0.1"
        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        allow_headers: "Content-Type,Authorization,X-Requested-With,X-Internal-Service-Token"
        allow_credential: true
      proxy-rewrite:
        headers:
          set:
            X-Forwarded-Proto: "https"
            X-Forwarded-Host: "$host"
      limit-req:
        rate: 40
        burst: 80
        key_type: var
        key: remote_addr
        rejected_code: 429
      response-rewrite:
        headers:
          Cache-Control: "no-store"
          X-Content-Type-Options: "nosniff"
          Referrer-Policy: "strict-origin-when-cross-origin"
    upstream:
      type: roundrobin
      nodes:
        "host.docker.internal:3005": 1

  - id: switchos-trpc
    name: switchos-trpc
    uri: /api/trpc/*
    methods: ["GET", "POST", "OPTIONS"]
    priority: 250
    plugins:
      cors:
        allow_origins: "https://switchos.localhost,https://localhost,https://127.0.0.1"
        allow_methods: "GET,POST,OPTIONS"
        allow_headers: "Content-Type,Authorization,X-Requested-With,X-Internal-Service-Token"
        allow_credential: true
      proxy-rewrite:
        headers:
          set:
            X-Forwarded-Proto: "https"
            X-Forwarded-Host: "$host"
      limit-req:
        rate: 60
        burst: 120
        key_type: var
        key: remote_addr
        rejected_code: 429
      response-rewrite:
        headers:
          Cache-Control: "no-store"
          X-Content-Type-Options: "nosniff"
          Referrer-Policy: "strict-origin-when-cross-origin"
    upstream:
      type: roundrobin
      nodes:
        "host.docker.internal:3005": 1
