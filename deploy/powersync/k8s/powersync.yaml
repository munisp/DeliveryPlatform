# PowerSync service — Kubernetes workloads (namespace switchos).
#
# Topology (per PowerSync self-host guidance): ONE logical instance = one
# replication pipeline (singleton) + N horizontally-scalable API containers.
# `start -r unified` runs both in one container; for anything beyond a pilot,
# split into the two Deployments below.
#
# Apply order and role SQL: deploy/powersync/README.md. Migration
# drizzle/0103_powersync_sync_support.sql MUST be applied before first start.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: powersync
  namespace: switchos
  labels:
    app.kubernetes.io/name: powersync
automountServiceAccountToken: false
---
# Non-secret config. Secrets (PS_SOURCE_URI, PS_STORAGE_URI, PS_ADMIN_TOKEN)
# come from the `powersync-secrets` Secret — create it out-of-band (or via the
# external-secrets overlay pattern in deploy/kubernetes/kind-dry-run/), never
# commit values.
apiVersion: v1
kind: ConfigMap
metadata:
  name: powersync-config
  namespace: switchos
  labels:
    app.kubernetes.io/name: powersync
data:
  POWERSYNC_CONFIG_PATH: /etc/powersync/service.yaml
  PS_JWKS_URI: "https://api.example.com/api/powersync/jwks.json"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: powersync-config-files
  namespace: switchos
  labels:
    app.kubernetes.io/name: powersync
data:
  # Generated from the repo at deploy time:
  #   kubectl -n switchos create configmap powersync-config-files \
  #     --from-file=service.yaml=deploy/powersync/service.yaml \
  #     --from-file=sync-rules.yaml=deploy/powersync/sync-rules.yaml \
  #     --dry-run=client -o yaml | kubectl apply -f -
  #
  # (Placeholder keys so the manifest is self-contained; the --from-file
  # command above replaces them with the real file contents.)
  service.yaml: ""
  sync-rules.yaml: ""
---
# Replication: SINGLETON. Logical replication from the source Postgres is a
# single pipeline; a second replica does not add throughput, only split-brain
# risk. Use Recreate strategy + warm-standby takeover (the pod re-attaches to
# the existing replication slot on restart).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: powersync-replication
  namespace: switchos
  labels:
    app.kubernetes.io/name: powersync
    app.kubernetes.io/component: replication
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: powersync
      app.kubernetes.io/component: replication
  template:
    metadata:
      labels:
        app.kubernetes.io/name: powersync
        app.kubernetes.io/component: replication
        app.kubernetes.io/part-of: deliveryplatform
    spec:
      serviceAccountName: powersync
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: powersync
          image: journeyapps/powersync-service:1.28.2
          command: ["start", "-r", "replication"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: powersync-config
          env:
            - name: PS_SOURCE_URI
              valueFrom:
                secretKeyRef:
                  name: powersync-secrets
                  key: PS_SOURCE_URI
            - name: PS_STORAGE_URI
              valueFrom:
                secretKeyRef:
                  name: powersync-secrets
                  key: PS_STORAGE_URI
            - name: PS_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: powersync-secrets
                  key: PS_ADMIN_TOKEN
          volumeMounts:
            - name: config-files
              mountPath: /etc/powersync
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /probes/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /probes/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: config-files
          configMap:
            name: powersync-config-files
---
# API: horizontally scalable. Planning number from PowerSync: ~100 concurrent
# sync connections per API pod — scale replicas = ceil(connections / 100).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: powersync-api
  namespace: switchos
  labels:
    app.kubernetes.io/name: powersync
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: powersync
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: powersync
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: deliveryplatform
    spec:
      serviceAccountName: powersync
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60 # drain long-lived sync streams
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: powersync
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: powersync
                    app.kubernetes.io/component: api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: powersync
          image: journeyapps/powersync-service:1.28.2
          command: ["start", "-r", "api"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: powersync-config
          env:
            - name: PS_SOURCE_URI
              valueFrom:
                secretKeyRef:
                  name: powersync-secrets
                  key: PS_SOURCE_URI
            - name: PS_STORAGE_URI
              valueFrom:
                secretKeyRef:
                  name: powersync-secrets
                  key: PS_STORAGE_URI
            - name: PS_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: powersync-secrets
                  key: PS_ADMIN_TOKEN
          volumeMounts:
            - name: config-files
              mountPath: /etc/powersync
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /probes/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /probes/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: config-files
          configMap:
            name: powersync-config-files
---
apiVersion: v1
kind: Service
metadata:
  name: powersync
  namespace: switchos
  labels:
    app.kubernetes.io/name: powersync
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: powersync
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Example Secret manifest shape — DO NOT commit real values. Prefer your
# external-secrets pipeline; this documents the required keys.
apiVersion: v1
kind: Secret
metadata:
  name: powersync-secrets
  namespace: switchos
  labels:
    app.kubernetes.io/name: powersync
type: Opaque
stringData:
  PS_SOURCE_URI: "postgresql://powersync_replication:REPLACE_ME@postgres-rw.switchos.svc:5432/switchos?sslmode=verify-full"
  PS_STORAGE_URI: "postgresql://powersync_storage:REPLACE_ME@postgres-rw.switchos.svc:5432/powersync_bucket?sslmode=verify-full"
  PS_ADMIN_TOKEN: "REPLACE_ME"
