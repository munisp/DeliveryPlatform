[switchos-longcat]
exten => 6000,1,NoOp(SwitchOS LongCat voice ordering)
 same => n,Answer()
 same => n,Set(CHANNEL(language)=en)
 same => n,Set(AUDIOSOCKET_ID=${UNIQUEID})
 same => n,AudioSocket(${AUDIOSOCKET_ID},127.0.0.1:9104)
 same => n,Hangup()

[from-internal]
exten => 6000,1,Goto(switchos-longcat,6000,1)

[from-external]
exten => 6000,1,Goto(switchos-longcat,6000,1)
