<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #020617; color: #f8fafc; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            position: relative;
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .accent-circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(34,211,238,0.1) 0%, rgba(34,211,238,0) 70%);
        }
        .circle-1 { width: 800px; height: 800px; top: -300px; left: -200px; }
        .circle-2 { width: 600px; height: 600px; bottom: -200px; right: -100px; }
        .grid-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(34, 211, 238, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 211, 238, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.5;
            pointer-events: none;
        }
        .content-wrapper {
            position: relative;
            z-index: 10;
            max-width: 1000px;
            padding: 40px;
        }
        .badge {
            display: inline-block;
            padding: 8px 16px;
            background-color: rgba(34, 211, 238, 0.1);
            border: 1px solid rgba(34, 211, 238, 0.3);
            color: #22d3ee;
            border-radius: 20px;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 64px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 24px;
            color: #f8fafc;
            letter-spacing: -1px;
        }
        p.subtitle {
            font-size: 24px;
            line-height: 1.5;
            color: #94a3b8;
            font-weight: 400;
        }
        .divider {
            width: 80px;
            height: 4px;
            background-color: #22d3ee;
            margin: 40px auto;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="grid-overlay"></div>
        <div class="accent-circle circle-1"></div>
        <div class="accent-circle circle-2"></div>

        <div class="content-wrapper">
            <div class="badge">SwitchOS Architecture</div>
            <h1>Next-Generation Stakeholder Verification</h1>
            <div class="divider"></div>
            <p class="subtitle">Consented KYC/KYB architecture, provider callbacks, document intelligence, and accountable human review.</p>
        </div>
    </div>
</body>
</html>
