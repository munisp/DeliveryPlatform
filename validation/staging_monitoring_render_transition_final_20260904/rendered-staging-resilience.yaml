apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: deliveryplatform-resilience-monitoring
    resilience.delivery-platform.io/environment: non-production
  name: kube-state-metrics
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
      app.kubernetes.io/part-of: deliveryplatform-resilience-monitoring
      resilience.delivery-platform.io/environment: non-production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/part-of: deliveryplatform-resilience-monitoring
        resilience.delivery-platform.io/environment: non-production
    spec:
      automountServiceAccountToken: true
      containers:
      - args:
        - --resources=jobs,pods,namespaces
        - --metric-labels-allowlist=jobs=[app.kubernetes.io/name]
        image: registry.invalid/deliveryplatform/kube-state-metrics@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        livenessProbe:
          httpGet:
            path: /livez
            port: http
        name: kube-state-metrics
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kube-state-metrics
