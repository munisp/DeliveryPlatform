apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: deliveryplatform
    prometheus: platform
  name: deliveryplatform-availability
  namespace: monitoring
spec:
  groups:
  - name: deliveryplatform.node-failure
    rules:
    - alert: DeliveryPlatformNodeNotReady
      annotations:
        runbook_url: https://runbooks.staging-render-only.invalid/node-failure
        summary: Kubernetes node {{ $labels.node }} is not Ready
      expr: kube_node_status_condition{condition="Ready",status="true"} == 0
      for: 10m
      labels:
        service: kubernetes
        severity: critical
    - alert: DeliveryPlatformNodePressure
      annotations:
        runbook_url: https://runbooks.staging-render-only.invalid/node-failure
        summary: Kubernetes node {{ $labels.node }} reports {{ $labels.condition }}
      expr: max by (node, condition) (kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure",status="true"})
        == 1
      for: 10m
      labels:
        service: kubernetes
        severity: warning
  - name: deliveryplatform.workload-availability
    rules:
    - alert: DeliveryPlatformDeploymentUnavailable
      annotations:
        runbook_url: https://runbooks.staging-render-only.invalid/node-failure
        summary: Deployment {{ $labels.deployment }} has unavailable replicas
      expr: kube_deployment_status_replicas_available{namespace="switchos"} < kube_deployment_spec_replicas{namespace="switchos"}
      for: 10m
      labels:
        service: deliveryplatform
        severity: critical
    - alert: DeliveryPlatformPDBExhausted
      annotations:
        runbook_url: https://runbooks.staging-render-only.invalid/node-failure
        summary: PDB {{ $labels.poddisruptionbudget }} has no voluntary-disruption
          headroom
      expr: kube_poddisruptionbudget_status_current_healthy{namespace="switchos"}
        <= kube_poddisruptionbudget_status_desired_healthy{namespace="switchos"}
      for: 5m
      labels:
        service: deliveryplatform
        severity: warning
    - alert: DeliveryPlatformHPAMaxedOut
      annotations:
        runbook_url: https://runbooks.staging-render-only.invalid/node-failure
        summary: HPA {{ $labels.horizontalpodautoscaler }} is at its maximum replica
          count
      expr: kube_horizontalpodautoscaler_status_current_replicas{namespace="switchos"}
        >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="switchos"}
      for: 15m
      labels:
        service: deliveryplatform
        severity: warning
    - alert: DeliveryPlatformContainerRestartStorm
      annotations:
        runbook_url: https://runbooks.staging-render-only.invalid/node-failure
        summary: Container {{ $labels.container }} is restarting repeatedly
      expr: sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total{namespace="switchos"}[15m]))
        >= 3
      for: 5m
      labels:
        service: deliveryplatform
        severity: warning
  - name: deliveryplatform.secret-synchronization
    rules:
    - alert: DeliveryPlatformExternalSecretNotReady
      annotations:
        runbook_url: https://runbooks.staging-render-only.invalid/node-failure
        summary: ExternalSecret {{ $labels.name }} is not synchronized
      expr: externalsecret_status_condition{namespace="switchos",condition="Ready",status="false"}
        == 1
      for: 10m
      labels:
        service: deliveryplatform
        severity: critical
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: deliveryplatform
    prometheus: platform
    resilience.delivery-platform.io/environment: non-production
  name: deliveryplatform-resilience-invariant-probe
  namespace: monitoring
spec:
  groups:
  - name: deliveryplatform.resilience-invariant-probe
    rules:
    - alert: ResilienceInvariantProbeFailed
      annotations:
        description: The isolated PostgreSQL probe detected a queue, offer, assignment,
          ledger, verification, or webhook-processing anomaly. Stop the active TestRun,
          clear Toxiproxy, delete PodChaos, open the resilience circuit breaker, and
          start the P0 incident procedure.
        runbook_url: https://runbooks.staging-render-only.invalid/resilience-invariant-probe
        summary: Resilience invariant probe {{ $labels.job_name }} failed
      expr: max by (namespace, job_name) (kube_job_status_failed{namespace="resilience-test",job_name=~"resilience-invariant-.*"})
        > 0
      for: 0m
      labels:
        circuit_breaker: open
        namespace: resilience-test
        resilience.delivery-platform.io/environment: non-production
        service: deliveryplatform-resilience
        severity: critical
    - alert: ResilienceInvariantProbeStalled
      annotations:
        description: The isolated invariant Job has neither succeeded nor failed after
          its bounded window. Stop the active TestRun, clear injected faults, open
          the resilience circuit breaker, preserve artifacts, and investigate queue
          drain, database availability, and Job status.
        runbook_url: https://runbooks.staging-render-only.invalid/resilience-invariant-probe
        summary: Resilience invariant probe {{ $labels.job_name }} exceeded its 35-minute
          window
      expr: (time() - max by (namespace, job_name) (kube_job_status_start_time{namespace="resilience-test",job_name=~"resilience-invariant-.*"})
        > 2100) and on (namespace, job_name) (max by (namespace, job_name) (kube_job_status_succeeded{namespace="resilience-test",job_name=~"resilience-invariant-.*"})
        == 0) and on (namespace, job_name) (max by (namespace, job_name) (kube_job_status_failed{namespace="resilience-test",job_name=~"resilience-invariant-.*"})
        == 0)
      for: 1m
      labels:
        circuit_breaker: open
        namespace: resilience-test
        resilience.delivery-platform.io/environment: non-production
        service: deliveryplatform-resilience
        severity: critical
    - alert: ResilienceInvariantProbeMissing
      annotations:
        description: Review whether the generated Job is pending, unscheduled, blocked
          on image pull, or missing metric scrape coverage. Do not close the circuit
          breaker based on this alert alone.
        runbook_url: https://runbooks.staging-render-only.invalid/resilience-invariant-probe
        summary: Resilience invariant probe {{ $labels.job_name }} has not reported
          success
      expr: kube_job_status_succeeded{namespace="resilience-test",job_name=~"resilience-invariant-.*"}
        == 0 unless on (namespace, job_name) kube_job_status_failed{namespace="resilience-test",job_name=~"resilience-invariant-.*"}
        > 0
      for: 45m
      labels:
        circuit_breaker: review
        namespace: resilience-test
        resilience.delivery-platform.io/environment: non-production
        service: deliveryplatform-resilience
        severity: warning
  - name: deliveryplatform.resilience-circuit-breaker-receiver
    rules:
    - expr: sum by (alertname) (increase(resilience_circuit_breaker_patch_failures_total[10m]))
      record: resilience:circuit_breaker_patch_failures_10m
    - alert: ResilienceCircuitBreakerPatchFailureEscalation
      annotations:
        description: Investigate receiver authentication, NetworkPolicy, service-account
          RBAC, Kubernetes API availability, and the ConfigMap state. The receiver
          must not retry by broadening privileges or close the breaker.
        runbook_url: https://runbooks.staging-render-only.invalid/resilience-circuit-breaker-receiver
        summary: Circuit-breaker receiver failed to open the breaker after three attempts
      expr: resilience:circuit_breaker_patch_failures_10m >= 3
      for: 0m
      labels:
        circuit_breaker: manual_intervention_required
        namespace: resilience-test
        resilience.delivery-platform.io/environment: non-production
        service: deliveryplatform-resilience
        severity: critical
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  labels:
    alertmanagerConfig: enabled
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: deliveryplatform-resilience-testing
  name: resilience-circuit-breaker
  namespace: monitoring
spec:
  receivers:
  - name: resilience-circuit-breaker-open
    webhookConfigs:
    - httpConfig:
        authorization:
          credentials:
            key: token
            name: resilience-circuit-breaker-alert-receiver-auth
          type: Bearer
        tlsConfig:
          ca:
            configMap:
              key: ca.crt
              name: resilience-circuit-breaker-alert-receiver-ca
          serverName: resilience-circuit-breaker-alert-receiver.resilience-test.svc
      maxAlerts: 10
      sendResolved: false
      url: https://resilience-circuit-breaker-alert-receiver.resilience-test.svc:8443/v1/alertmanager/open
  route:
    groupBy:
    - alertname
    - resilience_run_id
    - change_id
    groupInterval: 5m
    groupWait: 10s
    matchers:
    - matchType: =
      name: severity
      value: critical
    - matchType: =
      name: namespace
      value: resilience-test
    - matchType: =
      name: circuit_breaker
      value: open
    receiver: resilience-circuit-breaker-open
    repeatInterval: 4h
---
