<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vehicle-Access Schema Architecture</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #0f172a;
            color: #f8fafc;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding-top: 40px;
            padding-left: 40px;
            padding-right: 40px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 40px;
            font-weight: 700;
            color: #ffffff;
            border-bottom: 4px solid #38bdf8;
            display: inline-block;
            padding-bottom: 8px;
        }
        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 40px 40px 40px;
        }
        .image-container {
            width: 100%;
            height: 540px;
            background-color: #ffffff; /* White background for the diagram to ensure readability if it has dark text */
            border-radius: 8px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <h1>Vehicle-Access Schema Architecture</h1>
        </div>
        <div class="content">
            <div class="image-container">
                <img src="/home/ubuntu/DeliveryPlatform-commerce-field/validation/diagrams/vehicle_access_schema.png" alt="Vehicle Access Schema Diagram" />
            </div>
        </div>
    </div>
</body>
</html>
